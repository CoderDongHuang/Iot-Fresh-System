<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="iotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#2979ff" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <linearGradient id="freshGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#8bc34a" />
    </linearGradient>
  </defs>
  
  <!-- 外圈 - 物联网连接 -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#iotGradient)" stroke-width="2" />
  
  <!-- 内部连接点 -->
  <circle cx="10" cy="12" r="2" fill="#2979ff" />
  <circle cx="16" cy="8" r="2" fill="#00e676" />
  <circle cx="22" cy="12" r="2" fill="#00b0ff" />
  <circle cx="24" cy="18" r="2" fill="#2979ff" />
  <circle cx="20" cy="24" r="2" fill="#00e676" />
  <circle cx="12" cy="24" r="2" fill="#00b0ff" />
  <circle cx="8" cy="18" r="2" fill="#2979ff" />
  
  <!-- 连接线 -->
  <path d="M10,12 L16,8 L22,12 L24,18 L20,24 L12,24 L8,18 Z" 
        fill="none" stroke="url(#iotGradient)" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- 中心 - 生鲜品图标 -->
  <circle cx="16" cy="16" r="6" fill="url(#freshGradient)" />
  
  <!-- 温度计图标 -->
  <rect x="14.5" y="12" width="3" height="8" rx="1" fill="#ffffff" />
  <circle cx="16" cy="20" r="1.5" fill="#ff5252" />
  
  <!-- 叶子图标 -->
  <path d="M16,14 Q14,12 12,14 Q14,16 16,14" fill="#ffffff" opacity="0.8" />
  <path d="M16,14 Q18,12 20,14 Q18,16 16,14" fill="#ffffff" opacity="0.8" />
</svg>